<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Returning to Listr…</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font: -apple-system-body;
            font-family: system-ui, -apple-system, sans-serif;
            background: Canvas;
            color: CanvasText;
            text-align: center;
        }
        .title {
            font-size: 15px;
            font-weight: 600;
        }
        .hint {
            font-size: 13px;
            opacity: 0.6;
        }
        a {
            color: LinkText;
        }
    </style>
</head>
<body>
    <div class="title">Returning to Listr…</div>
    <div class="hint">If nothing happens, <a id="fallback-redirect-link">click here</a>.</div>

    <script>
        const redirectUrl = "listr://ebay-callback" + window.location.search;
        document.getElementById("fallback-redirect-link").href = redirectUrl;
        window.location.replace(redirectUrl);
    </script>
</body>
</html>
